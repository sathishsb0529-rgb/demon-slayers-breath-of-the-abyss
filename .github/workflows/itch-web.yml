
name: Build itch.io HTML Game

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/itch-web.yml'

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web game
        run: npm run build

      - name: Create itch.io ZIP
        run: |
          cd dist
          zip -r ../itch-web-build.zip .

      - name: Upload browser game
        uses: actions/upload-artifact@v4
        with:
          name: itch-html5-game
          path: itch-web-build.zip
          
